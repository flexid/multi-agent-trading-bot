[project]
name = "multi-agent-trading-bot"
version = "0.0.1"
description = "Autonomous multi-agent crypto trading bot on Bybit (spot + spot margin)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "mplfinance>=0.12.10b0",
    "numpy>=1.26",
    "openai>=1.50",
    "pandas>=2.2",
    "pandas-ta>=0.3.14b0",
    "pillow>=10.4",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "qrcode>=7.4",
    "sqlalchemy>=2.0",
    "typesafe-sdk>=0.7.4",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.110",
    "mypy>=1.10",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "types-boto3>=1.43.110",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "mplfinance.*", "pandas_ta.*", "boto3.*", "PIL.*", "qrcode.*"]
ignore_missing_imports = true
