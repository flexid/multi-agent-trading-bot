# Bot parameters. The owner sets these once; the bot decides everything else.
# Secrets do not belong here; they live in .env. See docs/SPEC.md §13.

[trading]
assets = ["BTC", "ETH", "SOL", "BNB", "SPX6900"]
capital_max_usdc = 0            # owner sets; counted in the quote coin (USDT)
live_allowed = false            # owner flips once; go-live itself is automatic (SPEC §10)
leverage_max = 10
leverage_max_spx6900 = 3
risk_per_trade = 0.005
capital_share_per_asset = 0.20
gross_exposure_max = 3.0
holding_min_hours = 1
holding_max_days = 7
short_allowed = true
day_loss_stop = -0.02
drawdown_pause = -0.10
emergency_brake = -0.25
depth_cap = 0.05
cycle_hours = 4

[exchange]
quote = "USDT"                  # quote coin of every traded pair
alt_quote = "USDC"              # compared in the self-test report only, never traded
recv_window_ms = 5000

[exchange.base_coin]            # asset -> exchange base coin, where they differ
SPX6900 = "SPX"

[posting]
enabled = true
handle = "decentradork"
language = "en"
style = "nonchalant"
delay_minutes = [1, 10]
max_posts_per_day = 20
post_in_shadow = false

[posting.cashtags]
BTC = "$BTC"
ETH = "$ETH"
SOL = "$SOL"
BNB = "$BNB"
SPX6900 = "$SPX"

[x]                             # X sentiment agent (SPEC §6)
# Curated accounts, handles without "@". Placeholder until the owner supplies the list.
accounts = ["decentradork"]
search_per_asset = 20           # posts per asset per cycle from recent search
reads_per_cycle_max = 90        # hard cap per 4h cycle; 6 cycles ≈ 540 of the 600/day budget

[site]                          # M8a public site and M8b admin (SPEC §12)
public_domain = "dorkbot.dev"
admin_domain = "admin.dorkbot.dev"
snapshot_interval_minutes = 5   # sanitized JSON pushed to Cloudflare for the public site

[budget]
api_usd_per_month = 550         # above this, downgrade models; never stop
x_reads_per_day = 600

[models]                        # all nine IDs verified against both providers on 2026-10-09
pm_1 = "claude-fable-5-1"
pm_2 = "gpt-5.6-sol"
macro = "gpt-5.6-terra"
chart_patterns = "claude-opus-5-5"
indicators = "claude-haiku-5-5"
polymarket = "gpt-5.6-luna"
x_sentiment = "claude-sonnet-5-5"
post_writer = "claude-sonnet-5-5"
post_auditor = "gpt-5.6-terra"

[llm]
timeout_s = 120
max_output_tokens = 4000
effort = "medium"               # Anthropic output_config.effort / OpenAI reasoning effort

[llm.pricing]                   # USD per 1M tokens: [input, output]. Anthropic from the API docs 2026-10-06.
"claude-fable-5-1" = [10.0, 50.0]
"claude-opus-5-5" = [4.0, 20.0]
"claude-sonnet-5-5" = [2.0, 10.0]
"claude-haiku-5-5" = [0.10, 0.50]
"gpt-5.6-sol" = [5.0, 25.0]     # estimate; replace with the published rate
"gpt-5.6-terra" = [2.0, 10.0]   # estimate
"gpt-5.6-luna" = [0.5, 2.5]     # estimate
