# Bot parameters. The owner sets these once; the bot decides everything else.
# Secrets do not belong here; they live in .env. See docs/SPEC.md §13.

[trading]
assets = ["BTC", "ETH", "SOL", "BNB", "SPX6900"]
capital_max_usdt = 10000        # paper equity in shadow; live starts at live_start_fraction of it
live_start_fraction = 0.10      # and never sizes beyond actual subaccount equity
live_allowed = false            # owner flips once; go-live itself is automatic (SPEC §10)
leverage_max = 10
leverage_max_spx6900 = 3
risk_per_trade = 0.005
risk_per_trade_max = 0.025      # the max shadow track: the leveraged variant (owner goal 1%/day, 2026-10-09)
capital_share_per_asset = 0.20
gross_exposure_max = 3.0
holding_min_hours = 1
holding_max_days = 7
short_allowed = true
day_loss_stop = -0.02
drawdown_pause = -0.10
emergency_brake = -0.25
depth_cap = 0.05
cycle_hours = 4

[pilot]                         # execution pilot after M9 (owner): real orders, 1x, small
enabled = false                 # owner flips once the subaccount holds capital_usdt
capital_usdt = 185              # what the subaccount holds (owner, 2026-10-09)

[exchange]
quote = "USDT"                  # quote coin of every traded pair
alt_quote = "USDC"              # compared in the self-test report only, never traded
recv_window_ms = 5000
extra_candle_symbols = ["ETHBTC", "SOLBTC"]  # dominance proxies, never traded
backup_stop = true               # conditional stop-market on Bybit, 0.5 ATR beyond the bot's stop; the live self-test verifies it
price_feed = "ws"                # executor quotes: public WebSocket, REST ticker as fallback; "rest" = 10 s polling

[exchange.base_coin]            # asset -> exchange base coin, where they differ
SPX6900 = "SPX"

[posting]
enabled = true
handle = "decentradork"
language = "en"
style = "plain"                 # normal capitalization, direct; dry humour allowed (owner)
delay_minutes = [1, 10]
max_posts_per_day = 20
post_in_shadow = true           # owner: shadow trades are posted, written and audited like live, with a marker
highlight_margin_pct = 0.10     # a close at +10% on margin or better gets the trade card and a pleased post

[posting.cashtags]
BTC = "$BTC"
ETH = "$ETH"
SOL = "$SOL"
BNB = "$BNB"
SPX6900 = "$SPX"

[risk]
# Bybit UTA cross-margin liquidation: collateral is haircut by the coin's collateral ratio
# (from the API) and liabilities carry the maintenance margin rate. The rate is not exposed
# by the API; 0.03 is the documented spot-margin figure, to be confirmed in the live
# self-test (M9). See DECISIONS.
maintenance_margin_rate = 0.03

[agents.macro]                  # crypto-native weights, set from app/backtest_native.py (see DECISIONS)
fng_weight = 0.25               # Fear & Greed, contrarian at extremes; also a risk flag
dominance_weight = 0.0          # BTC dominance tilt: logged only until real dominance history exists

[agents.weights_by_asset]       # overrides on the tuned weights, renormalized per asset
SPX6900 = { x_sentiment = 0.40, polymarket = 0.0 }   # owner 2026-10-09: community sentiment and volume drive SPX6900; Polymarket has no markets on it

[x]                             # X sentiment agent (SPEC §6)
# Curated accounts, handles without "@". Owner's list (2026-10-09), duplicates removed.
accounts = [
  "decentradork", "spx6900", "DrProfitCrypto", "MustStopMurad", "trader1sz", "MerlijnTrader", "Exitpump",
  "benjamincowen", "CryptoCapo_", "Rektcapital", "Durov", "CryptoMichNL", "Duonine", "Devchart",
  "Quintenfrancois", "Murocrypto", "VitalikButerin", "saylor", "cz_binance", "brian_armstrong",
  "APompliano", "balajis", "LynAldenContact", "RaoulGMI", "CryptoHayes", "woonomic",
  "100trillionUSD", "WClementeIII", "nic__carter", "lopp", "danheld", "zachxbt", "lookonchain",
  "glassnode", "cryptoquant_com", "WuBlockchain", "tier10k", "EleanorTerrett", "hasufl", "cobie",
