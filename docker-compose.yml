# Local: `make up` starts Postgres only. Server: `docker compose --profile bot up -d` runs
# everything. The executor is its own process (non-negotiable 3).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    profiles: ["bot"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@postgres:5432/bot
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    profiles: ["bot"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@postgres:5432/bot
    command: ["python", "-m", "app.scheduler"]
    volumes:
      - ./logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  admin:
    # Own container, own env file: no Bybit, X, LLM or Cloudflare keys (SPEC §12 M8b).
    profiles: ["bot"]
    build: .
    env_file: .env.admin
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@postgres:5432/bot
    command: ["uvicorn", "app.admin.app:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  executor:
    profiles: ["bot"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@postgres:5432/bot
    command: ["python", "-m", "app.execution.executor"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
