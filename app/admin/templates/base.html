<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dorkbot admin</title>
<link rel="icon" href="/static/favicon-32.png?v=6d8a4f25"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=6d8a4f25">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<style>
:root, [data-theme=dark] { --pico-background-color:#0a0a0a; --pico-card-background-color:#121212; --pico-card-sectioning-background-color:#161616; --pico-primary:#fe7e1c; --pico-primary-hover:#ff9a4d; --pico-primary-background:#fe7e1c; --pico-primary-hover-background:#ff9a4d; --pico-primary-underline:#fe7e1c66; --pico-primary-focus:#fe7e1c44; --pico-muted-color:#8f958f; --pico-font-size:92%; --pico-spacing:0.9rem; --pico-block-spacing-vertical:1.4rem; --pico-form-element-spacing-vertical:.45rem; --pico-form-element-spacing-horizontal:.8rem }
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}main.container{max-width:1100px}
nav{margin-bottom:1.2rem}nav img.avatar{width:40px;height:40px;border-radius:50%;vertical-align:middle}nav ul li{padding:.4rem .6rem}
h1{font-size:1.4rem;margin-bottom:.6rem}article{padding:1.1rem 1.3rem;margin-bottom:1.2rem}article header{margin:-1.1rem -1.3rem 1rem;padding:.7rem 1.3rem;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:#fe7e1c}
table{font-size:.85rem}table.positions{table-layout:fixed}table.positions th:nth-child(1){width:9%}table.positions th:nth-child(2){width:9%}table.positions th:nth-child(3){width:8%}table.positions td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th{color:var(--pico-muted-color);font-weight:500}td,th{padding:.45rem .5rem}
.small{font-size:.8rem}.up{color:#b6ff00}.down{color:#ff5c5c}.warn{color:#f7c97a}.long{color:#b6ff00}.short{color:#ff5c5c}.muted{color:var(--pico-muted-color)}
.badge{display:inline-block;padding:.1rem .6rem;border:1px solid #333;border-radius:999px;font-size:.72rem;color:#8f958f;margin-left:.5rem;vertical-align:middle}.badge.accent{border-color:#fe7e1c;color:#fe7e1c}.badge.neon{border-color:#b6ff00;color:#b6ff00}.badge.down{border-color:#ff5c5c;color:#ff5c5c}.badge.warn{border-color:#f7c97a;color:#f7c97a}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.9rem}.tile{background:#161616;border:1px solid #222;border-radius:10px;padding:.9rem 1rem}.tile .k{color:var(--pico-muted-color);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}.tile .v{font-size:1.35rem;font-weight:650;margin-top:.15rem}
form.inline{display:inline-block;margin:0 .3rem .3rem 0}form.inline input{width:auto;display:inline-block;margin:0 .3rem 0 0}form.inline button{width:auto;display:inline-block;margin:0}button.danger{--pico-background-color:#ff5c5c;--pico-border-color:#ff5c5c;--pico-color:#0a0a0a}
pre{white-space:pre-wrap;font-size:.78rem;color:var(--pico-muted-color)}.overflow{overflow-x:auto}.wordmark{display:block;width:min(520px,90vw);margin:2.5rem auto 1rem}.wordmark img{width:100%;height:auto;display:block}
</style></head><body><main class="container">
{% if user %}<nav><ul><li><a href="/"><img class="avatar" src="/static/avatar-96.png?v=6d8a4f25" alt="dorkbot"></a></li><li><a href="/">Overview</a></li><li><a href="/decisions">Decisions</a></li><li><a href="/params">Parameters &amp; audit</a></li></ul>
<ul><li><form class="inline" method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="outline secondary">Logout {{ user }}</button></form></li></ul></nav>{% endif %}
{% block body %}{% endblock %}
</main></body></html>
