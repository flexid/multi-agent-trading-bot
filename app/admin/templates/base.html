<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dorkbot admin</title>
<link rel="icon" href="/static/favicon-32.png?v=6d8a4f25"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=6d8a4f25">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
<style>
:root, [data-theme=dark] { --pico-background-color:#0a0a0a; --pico-card-background-color:#121212; --pico-card-sectioning-background-color:#161616; --pico-primary:#fe7e1c; --pico-primary-hover:#ff9a4d; --pico-primary-background:#fe7e1c; --pico-primary-hover-background:#ff9a4d; --pico-primary-underline:#fe7e1c66; --pico-primary-focus:#fe7e1c44; --pico-muted-color:#8f958f; --pico-font-size:92%; --pico-spacing:0.9rem; --pico-block-spacing-vertical:1.4rem; --pico-form-element-spacing-vertical:.45rem; --pico-form-element-spacing-horizontal:.8rem }
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}main.container{max-width:1100px}
nav{margin-bottom:1.2rem;flex-wrap:wrap}nav ul{flex-wrap:wrap}nav a{color:var(--pico-muted-color);text-decoration:none}nav a:hover{color:#fff}nav a.on{color:#fe7e1c;font-weight:650}nav img.avatar{width:40px;height:40px;border-radius:50%;vertical-align:middle}nav ul li{padding:.4rem .6rem}
h1{font-size:1.4rem;margin-bottom:.6rem}article{padding:1.1rem 1.3rem;margin-bottom:1.2rem}article header{margin:-1.1rem -1.3rem 1rem;padding:.7rem 1.3rem;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:#fe7e1c}article header b{color:#fff;font-weight:700}
details.acc{border:1px solid #2a2a2a;border-radius:8px;background:#0f0f0f;margin:0 0 .5rem;padding:0}details.acc>summary{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;cursor:pointer;list-style:none;margin:0;color:var(--pico-color);border-radius:8px}details.acc>summary::-webkit-details-marker{display:none}details.acc>summary:hover{background:#161616}details.acc>summary::before{content:"▸";color:#fe7e1c;font-size:1rem;width:1rem;transition:transform .15s}details.acc[open]>summary::before{transform:rotate(90deg)}details.acc>summary::after{content:"show";background:none;width:auto;height:auto;transform:none;float:none;margin-left:auto;color:var(--pico-muted-color);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}details.acc[open]>summary::after{content:"hide"}details.acc[open]>summary{border-bottom:1px solid #222;border-radius:8px 8px 0 0}details.acc>:not(summary){padding:.4rem .9rem .6rem}details.acc table{margin-bottom:.2rem}
table{font-size:.85rem}table.positions{table-layout:fixed}table.positions th:nth-child(1){width:9%}table.positions th:nth-child(2){width:9%}table.positions th:nth-child(3){width:8%}table.positions td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th{color:var(--pico-muted-color);font-weight:500}th.num,td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}table.matrix td{line-height:1.25}table.decs td,table.decs th{white-space:nowrap;padding:.4rem .45rem}table.decs .reason{white-space:normal;min-width:19rem;width:34%}table.decs button,table button.outline{white-space:nowrap;min-width:max-content}td,th{padding:.45rem .5rem}
.small{font-size:.8rem}.admin-foot{display:flex;justify-content:center;padding:64px 0}.admin-foot img{width:min(300px,80vw);height:auto;opacity:.85}.admin-tag{color:#fff;font-weight:700;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;margin-right:.6rem}.cycles{max-height:calc(4 * 2.05rem);overflow-y:auto;border:1px solid #222;border-radius:8px;background:#0f0f0f}.cycles a{display:grid;grid-template-columns:3.2rem 9rem 1fr 5rem 4rem;gap:.6rem;padding:.35rem .7rem;font-size:.8rem;color:var(--pico-color);text-decoration:none;border-bottom:1px solid #1a1a1a}.cycles a:hover{background:#161616}.cycles a.on{background:#1f1407;border-left:3px solid #fe7e1c}.cycles a .st-done{color:#b6ff00}.cycles a .st-aborted,.cycles a .st-failed{color:#ff5c5c}.cycles a .st-running{color:#f7c97a}.up{color:#b6ff00}.down{color:#ff5c5c}.warn{color:#f7c97a}.long{color:#b6ff00}.short{color:#ff5c5c}.muted{color:var(--pico-muted-color)}
.badge{display:inline-block;padding:.1rem .6rem;border:1px solid #333;border-radius:999px;font-size:.72rem;color:#8f958f;margin-left:.5rem;vertical-align:middle}.badge.accent{border-color:#fe7e1c;color:#fe7e1c}.badge.neon{border-color:#b6ff00;color:#b6ff00}.badge.down{border-color:#ff5c5c;color:#ff5c5c}.badge.warn{border-color:#f7c97a;color:#f7c97a}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.9rem}.tile{background:#161616;border:1px solid #222;border-radius:10px;padding:.9rem 1rem}.tile .k{color:var(--pico-muted-color);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}.tile .v{font-size:1.35rem;font-weight:650;margin-top:.15rem}.tile .sub{font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
form.inline{display:inline-block;margin:0 .3rem .3rem 0}form.inline input{width:auto;display:inline-block;margin:0 .3rem 0 0}form.inline button{width:auto;display:inline-block;margin:0}button.danger{--pico-background-color:#ff5c5c;--pico-border-color:#ff5c5c;--pico-color:#0a0a0a}
pre{white-space:pre-wrap;font-size:.78rem;color:var(--pico-muted-color)}.overflow{overflow-x:auto}.wordmark{display:block;width:min(520px,90vw);margin:2.5rem auto 1rem}.wordmark img{width:100%;height:auto;display:block}
</style></head><body><main class="container">
{% if user %}<nav><ul><li><a href="/"><img class="avatar" src="/static/avatar-96.png?v=6d8a4f25" alt="dorkbot"></a></li>{% set path = request.url.path %}<li><a href="/" class="{{ 'on' if path == '/' else '' }}">Overview</a></li><li><a href="/trades" class="{{ 'on' if path == '/trades' else '' }}">Trades</a></li><li><a href="/decisions" class="{{ 'on' if path == '/decisions' else '' }}">Decisions</a></li><li><a href="/risk" class="{{ 'on' if path == '/risk' else '' }}">Risk</a></li><li><a href="/readings" class="{{ 'on' if path == '/readings' else '' }}">Readings</a></li><li><a href="/sources" class="{{ 'on' if path == '/sources' else '' }}">Sources</a></li><li><a href="/costs" class="{{ 'on' if path == '/costs' else '' }}">Costs</a></li><li><a href="/params" class="{{ 'on' if path == '/params' else '' }}">Parameters</a></li><li><a href="/system" class="{{ 'on' if path == '/system' else '' }}">System</a></li><li><a href="/arena" class="{{ 'on' if path == '/arena' else '' }}">Arena</a></li></ul>
<ul><li><span class="admin-tag">ADMIN</span></li><li><form class="inline" method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="outline secondary">Logout {{ user }}</button></form></li></ul></nav>{% endif %}
{% block body %}{% endblock %}
{% if user %}<footer class="admin-foot"><a href="/"><img src="/static/logo-600.png?v=6d8a4f25" alt="dorkbot"></a></footer>{% endif %}
{% if user and next_cycle_at %}<script>
(function(){var at=new Date("{{ next_cycle_at.isoformat() }}");function tick(){var s=Math.max(0,Math.floor((at-Date.now())/1000));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;document.querySelectorAll(".countdown").forEach(function(e){e.textContent=(h?h+"h ":"")+(m<10&&h?"0":"")+m+"m "+(x<10?"0":"")+x+"s";});}tick();setInterval(tick,1000);})();
</script>{% endif %}
</main></body></html>
