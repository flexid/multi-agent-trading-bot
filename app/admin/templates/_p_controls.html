<article><header>Controls</header><p>{% include "_stepup.html" %}</p>
{% if stepped %}<form method="post" action="/control/kill" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><input name="reason" placeholder="reason"> <button class="danger" onclick="return confirm('Close everything, repay, freeze?')">Kill switch</button></form>
<form method="post" action="/control/pause" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="outline">Pause (no new positions)</button></form>
<form method="post" action="/control/resume" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="outline">Resume (clears the emergency brake)</button></form>{% endif %}
</article>
