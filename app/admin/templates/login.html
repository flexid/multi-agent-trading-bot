{% extends "base.html" %}{% block body %}
<h1>dorkbot admin</h1>
{% if error %}<p class="down">{{ error }}</p>{% endif %}
<form method="post" action="/login"><p><input name="username" placeholder="username" autocomplete="username" required></p>
<p><input name="password" type="password" placeholder="password" autocomplete="current-password" required></p>
<p><input name="code" placeholder="TOTP code" inputmode="numeric" autocomplete="one-time-code"></p><p><button>Log in</button></p></form>
{% endblock %}
