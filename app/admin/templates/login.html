{% extends "base.html" %}{% block body %}
<a class="wordmark" href="/login"><img src="/static/logo-1200.png?v=6d8a4f25" alt="dorkbot"></a>
<article style="max-width:420px;margin:0 auto 2rem"><header>Sign in</header>
{% if notice %}<p class="warn">{{ notice }}</p>{% endif %}{% if error %}<p class="down">{{ error }}</p>{% endif %}
<form method="post" action="/login"><input name="username" placeholder="username" autocomplete="username" required>
<input name="password" type="password" placeholder="password" autocomplete="current-password" required>
<input name="code" placeholder="TOTP code" inputmode="numeric" autocomplete="one-time-code"><button>Log in</button></form>
</article>{% endblock %}
