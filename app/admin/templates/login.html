{% extends "base.html" %}{% block body %}
<article style="max-width:420px;margin:2rem auto"><header>Sign in</header>
{% if error %}<p class="down">{{ error }}</p>{% endif %}
<form method="post" action="/login"><input name="username" placeholder="username" autocomplete="username" required>
<input name="password" type="password" placeholder="password" autocomplete="current-password" required>
<input name="code" placeholder="TOTP code" inputmode="numeric" autocomplete="one-time-code"><button>Log in</button></form>
</article>{% endblock %}
